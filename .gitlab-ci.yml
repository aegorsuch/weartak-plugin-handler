variables:
  GRADLE_BUILD_LAUNCHER_TAG: "2.6.2"
  KUBERNETES_MEMORY_LIMIT: "8Gi"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages: [test, build, sync, publish]

.protected_main:
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_ID == "7062" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'

.protected_version_tag:
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_ID == "7062" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'

.verify:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - !reference [.protected_main, rules]
    - !reference [.protected_version_tag, rules]

.gradle_image:
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]

release_publisher_tests:
  extends: .verify
  stage: test
  image: python:3.12-slim
  script:
    - python -m unittest discover -s ci/tests -v

release_checklist_tests:
  extends: .verify
  stage: test
  image: node:22-slim
  script:
    - node --test ci/release-testing/create_release_test_issue.test.cjs

unit_tests:
  extends: [.gradle_image, .verify]
  stage: test
  interruptible: true
  script:
    - ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml

.release_build:
  extends: .gradle_image
  stage: build
  script:
    - bash ci/build_signed_apk.sh
  after_script:
    - rm -f app/weartak.keystore signing.properties
  artifacts:
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/release/WearTAK-Plugin-Handler-*.apk
      - app/build/outputs/apk/release/verified-apk.sha256
      - app/build/outputs/apk/release/output-metadata.json

main_release:
  extends: [.release_build, .protected_main]

official_release:
  extends: [.release_build, .protected_version_tag]
  artifacts:
    expire_in: never

sync_github:
  stage: sync
  image:
    name: alpine/git:v2.49.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  dependencies: []
  resource_group: handler-github-sync
  script:
    - sh ci/sync_github.sh
  rules:
    - if: '$HANDLER_GITHUB_SYNC_ENABLED != "true"'
      when: never
    - !reference [.protected_main, rules]
    - !reference [.protected_version_tag, rules]

publish_github_main:
  stage: publish
  image: python:3.12-slim
  dependencies:
    - main_release
  resource_group: handler-github-release
  interruptible: false
  script:
    - python ci/publish_github_release.py
  rules:
    - if: '$HANDLER_GITHUB_SYNC_ENABLED != "true" || $HANDLER_GITHUB_RELEASE_ENABLED != "true"'
      when: never
    - !reference [.protected_main, rules]
