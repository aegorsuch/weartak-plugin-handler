name: Signed WearTAK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Validate release version and signing secrets
        id: release
        env:
          WEARTAK_RELEASE_KEYSTORE_B64: ${{ secrets.WEARTAK_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          test "$TAG_VERSION" = "$VERSION"
          test -n "$WEARTAK_RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$WEARTAK_RELEASE_KEYSTORE_B64" | base64 --decode > app/weartak.keystore
          chmod 600 app/weartak.keystore
          : > signing.properties
          chmod 600 signing.properties
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build signed release
        env:
          WEARTAK_RELEASE_KEYSTORE_FILE: app/weartak.keystore
          WEARTAK_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          WEARTAK_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          WEARTAK_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:assembleRelease
      - name: Verify signer and name APK
        id: apk
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/.*certificate SHA-256 digest: //p' |
            head -1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED="1579b600cd84e619e76a91c2db6b031938c999bc2aad926b9a51ec2b166d348d"
          test "$ACTUAL" = "$EXPECTED"
          RELEASE_APK="WearTAK-Plugin-Handler-${VERSION}-p${GITHUB_RUN_NUMBER}.apk"
          mv "$APK" "$RELEASE_APK"
          echo "path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "$APK_PATH" --title "WearTAK Handler $VERSION" --generate-notes
